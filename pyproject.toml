[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter, not blocker)
    "B008",   # do not perform function call in argument defaults
    "SIM108", # use ternary operator — not always clearer
    "RUF012", # mutable class attributes (SQLAlchemy models use these)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "SIM300"]

[tool.ruff.lint.isort]
known-first-party = ["web", "kms"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
