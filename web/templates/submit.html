{% extends "base.html" %}

{% block title %}Processing — VT Email Saver{% endblock %}

{% block content %}
<main id="main-container">
    <div class="card-glass">
        <h2>Processing Your Submission</h2>
        <div id="submit-animation-container">
            <canvas id="storing-animation" class="animation visible"></canvas>
            <canvas id="login-animation" class="animation hidden"></canvas>
            <canvas id="push-animation" class="animation hidden"></canvas>
            <canvas id="success-animation" class="animation hidden"></canvas>
            <canvas id="error-animation" class="animation hidden"></canvas>
        </div>
        <p id="status-message">Storing your credentials securely...</p>
        <div id="duo-code-display" class="duo-code-display hidden" aria-live="polite">
            <p class="duo-code-label">Enter in Duo Mobile</p>
            <p id="duo-code-value" class="duo-code-value"></p>
            <p class="duo-code-hint">Open the Duo app and type this code to verify</p>
        </div>
    </div>
</main>
{% endblock %}

{% block scripts %}
    <script type="module" src="{{ url_for('static', filename='js/submit.js') }}"></script>
{% endblock %}
