<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virginia Tech Email Saver</title>
    <!-- Bootstrap CSS -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
    crossorigin="anonymous"
    />
    <!-- Custom Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script type="module" src="{{ url_for('static', filename='js/animations.js') }}"></script>
</head>
<body>
    <div id="main-container">
        <div class="container text-center">
            <h1>Virginia Tech Email Saver</h1>
            <!-- Form that triggers vt_google_login.py -->
            <form id="credentials-form" method="POST" action="/submit">
                <div class="mb-3">
                    <label for="vt_email" class="form-label">VT Email:</label>
                    <input type="email" id="vt_email" name="vt_email" class="form-control mx-auto" style="max-width: 300px;" required autocomplete="email">
                </div>
                <div class="mb-3">
                    <label for="vt_password" class="form-label">Password:</label>
                    <div class="input-group mx-auto" style="max-width: 300px;">
                        <input type="password" id="vt_password" name="vt_password" class="form-control" required autocomplete="current-password">
                        <button type="button" id="toggle-password" class="btn btn-outline-light" tabindex="-1" title="Show password">
                            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                            </svg>
                            <svg id="eye-slash-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" style="display:none;">
                                <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z"/>
                                <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829z"/>
                                <path d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7.029 7.029 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12-.708.708z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Submit</button>
            </form>          
            <div id="credits" class="mt-3">
                <small>
                    Created by <a href="https://github.com/tfeuerbach" target="_blank">Thomas Feuerbach</a> | 
                    <a href="https://github.com/tfeuerbach/virginiatech-email-saver" target="_blank">View Source on GitHub</a>
                </small>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"
    ></script>
    <script>
        // Add custom validation messages
        document.getElementById('credentials-form').addEventListener('submit', function (e) {
            const emailInput = document.getElementById('vt_email');
            const passwordInput = document.getElementById('vt_password');

            // Check if email is empty
            if (!emailInput.value) {
                emailInput.setCustomValidity("Please enter your Virginia Tech email address.");
            } else {
                emailInput.setCustomValidity(""); // Clear message if valid
            }

            // Check if password is empty
            if (!passwordInput.value) {
                passwordInput.setCustomValidity("Please enter your password.");
            } else {
                passwordInput.setCustomValidity(""); // Clear message if valid
            }
        });

        // Reset the custom message on input
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', function () {
                this.setCustomValidity("");
            });
        });

        // Password visibility toggle
        document.getElementById('toggle-password').addEventListener('click', function () {
            const passwordInput = document.getElementById('vt_password');
            const eyeIcon = document.getElementById('eye-icon');
            const eyeSlashIcon = document.getElementById('eye-slash-icon');
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            eyeIcon.style.display = isHidden ? 'none' : 'block';
            eyeSlashIcon.style.display = isHidden ? 'block' : 'none';
            this.title = isHidden ? 'Hide password' : 'Show password';
            passwordInput.focus();
        });
    </script>
</body>
</html>
